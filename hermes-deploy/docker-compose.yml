# Hermes OS — Docker Compose v1.5
# Ugreen DXP4800 Plus | 3-Pool Storage Architecture
# Deploy path: /volume3/hermes/deploy/docker-compose.yml

services:
  # ============================================================
  # Database Layer — Pool 2 SSD (AI Data Layer)
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /volume2/hermes-data/postgres:/var/lib/postgresql/data
      - /volume1/hermes-cold/backups/postgres:/backups
    ports:
      - "5435:5432"
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hermes-qdrant
    restart: unless-stopped
    volumes:
      - /volume2/hermes-data/qdrant:/qdrant/storage
      - /volume1/hermes-cold/backups/qdrant:/backups
    environment:
      QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD_KB: 20000
    ports:
      - "6333:6333"
    networks:
      - hermes-net

  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    volumes:
      - /volume2/hermes-data/redis:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Development — code-server (Pool 3 SSD)
  # ============================================================

  code-server:
    image: codercom/code-server:latest
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /volume3/code-server/config:/home/coder/.config
      - /volume3/hermes:/home/coder/hermes:ro
      - /volume3/code-server/workspace:/home/coder/workspace
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD}
    user: "1000:1000"
    networks:
      - hermes-net

  # ============================================================
  # Hermes Runtime — Pool 3 SSD
  # Services use Docker DNS for internal communication:
  #   POSTGRES_HOST=hermes-postgres (not 192.168.9.2)
  #   QDRANT_HOST=hermes-qdrant
  #   REDIS_HOST=hermes-redis
  # ============================================================

  hermes-agent:
    build:
      context: /volume3/hermes/source/agent
      dockerfile: Dockerfile
    image: hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - /volume3/hermes/source/agent:/app
      - /volume3/hermes/configs:/config
      - /volume1/hermes-cold/documents:/data/documents:ro
    environment:
      CORE_URL: http://hermes-core:8000
      KNOWLEDGE_URL: http://hermes-knowledge:8000
      MEMORY_URL: http://hermes-memory:8000
      POSTGRES_HOST: hermes-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: hermes-redis
      REDIS_PORT: "6379"
    ports:
      - "8010:8000"
    networks:
      - hermes-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hermes-core:
        condition: service_started

  hermes-memory:
    build:
      context: /volume3/hermes/source/memory
      dockerfile: Dockerfile
    image: hermes-memory:latest
    container_name: hermes-memory
    restart: unless-stopped
    volumes:
      - /volume3/hermes/source/memory:/app
      - /volume3/hermes/configs:/config
    environment:
      POSTGRES_HOST: hermes-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: hermes-qdrant
      QDRANT_PORT: "6333"
      REDIS_HOST: hermes-redis
      REDIS_PORT: "6379"
      MEMORY_SCHEMA: memory
    networks:
      - hermes-net
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  hermes-gateway:
    build:
      context: /volume3/hermes/source/gateway
      dockerfile: Dockerfile
    image: hermes-gateway:latest
    container_name: hermes-gateway
    restart: unless-stopped
    volumes:
      - /volume3/hermes/source/gateway:/app
      - /volume3/logs/gateway:/app/logs
    environment:
      CORE_HOST: hermes-core
      CORE_PORT: "8000"
    ports:
      - "8642:8000"
    networks:
      - hermes-net
    depends_on:
      hermes-core:
        condition: service_started

  hermes-core:
    build:
      context: /volume3/hermes/source/core
      dockerfile: Dockerfile
    image: hermes-core:latest
    container_name: hermes-core
    restart: unless-stopped
    volumes:
      - /volume3/hermes/source/core:/app
      - /volume3/logs/core:/app/logs
    environment:
      POSTGRES_HOST: hermes-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: hermes-qdrant
      QDRANT_PORT: "6333"
      REDIS_HOST: hermes-redis
      REDIS_PORT: "6379"
      MEMORY_HOST: hermes-memory
      MEMORY_PORT: "8000"
    networks:
      - hermes-net
    depends_on:
      hermes-memory:
        condition: service_started

  hermes-knowledge:
    build:
      context: /volume3/hermes/source/knowledge
      dockerfile: Dockerfile
    image: hermes-knowledge:latest
    container_name: hermes-knowledge
    restart: unless-stopped
    volumes:
      - /volume3/hermes/source/knowledge:/app
      - /volume1/hermes-cold/documents:/data/documents:ro
      - /volume1/hermes-cold/assets:/data/assets:ro
    environment:
      QDRANT_HOST: hermes-qdrant
      QDRANT_PORT: "6333"
      KNOWLEDGE_EDUCATION_VERSION: ${KNOWLEDGE_EDUCATION_VERSION:-v1}
    networks:
      - hermes-net
    depends_on:
      qdrant:
        condition: service_started

  # ============================================================
  # Hermes Ingestion — School Data Pipeline (Phase 10.1)
  # ============================================================
  hermes-ingestion:
    build:
      context: /volume3/hermes/source/ingestion
      dockerfile: Dockerfile
    image: hermes-ingestion:latest
    container_name: hermes-ingestion
    restart: unless-stopped
    volumes:
      - /volume3/hermes/source/ingestion:/app
      - /volume1/hermes-cold/education/raw:/data/ingestion:ro
    environment:
      POSTGRES_HOST: hermes-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: hermes-qdrant
      QDRANT_PORT: "6333"
      CSV_MOUNT_PATH: /data/ingestion
    ports:
      - "8011:8000"
    networks:
      - hermes-net
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

networks:
  hermes-net:
    external: true
